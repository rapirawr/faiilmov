---
deployment:
  tasks:
    # ─── Variabel path ────────────────────────────────────────────
    - export APPPATH=/home/faiiller/faiilmov.my.id/faiilmov-repo
    - export DOMAINPATH=/home/faiiller/faiilmov.my.id
    - export DEPLOYPATH=/home/faiiller/faiilmov.my.id/public

    # ─── 1. Install Composer dependencies (no dev) ────────────────
    - /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

    # ─── 2. Build frontend assets ─────────────────────────────────
    - /usr/bin/npm ci --prefer-offline
    - /usr/bin/npm run build

    # ─── 3. Cache Laravel config/route/view ───────────────────────
    - /usr/local/bin/php artisan config:cache
    - /usr/local/bin/php artisan route:cache
    - /usr/local/bin/php artisan view:cache

    # ─── 4. Run migrations ────────────────────────────────────────
    - /usr/local/bin/php artisan migrate --force

    # ─── 5. Create storage symlink ────────────────────────────────
    - /usr/local/bin/php artisan storage:link --force

    # ─── 6. Fix storage & cache permissions ───────────────────────
    - /bin/chmod -R 775 storage bootstrap/cache

    # ─── 7. Deploy public folder ke document root ─────────────────
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R $APPPATH/public/. $DEPLOYPATH/

    # ─── 8. Deploy root .htaccess ke domain root ──────────────────
    - /bin/cp $APPPATH/.htaccess $DOMAINPATH/.htaccess

    # ─── 9. Arahkan index.php ke app root yang benar ──────────────
    - /bin/sed -i "s|__DIR__.'/..|$APPPATH|g" $DEPLOYPATH/index.php